services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:${POSTGRES_PASSWORD:-local-development-only}@db:5432/knowledge
      DATA_DIR: /app/data
    volumes:
      - files:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
  files:
